{% macro render_field(field) %}
<div class="mb-3">
    {{ field.label(class="form-label") }}
    {{ field(class="form-control") }}
    {% if field.errors %}
        {% for err in field.errors %}
            <div class="text-danger">{{ err }}</div>
        {% endfor %}
    {% endif %}
</div>
{% endmacro %}
