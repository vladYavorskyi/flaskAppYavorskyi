{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>Список продуктів</h1>
<ul>
    {% for product in products %}
    <li>
        <a href="{{ url_for('products.product_detail', product_id=product.id) }}">{{ product.name }} - ${{ product.price }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
