{% extends 'base.html' %}
{% block title %}Список товарів{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Каталог продуктів</h1>

<div class="row">
    {% for p in products %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">{{ p.name }}</h5>

                {% if p.price %}
                <p class="card-text text-success fw-bold">${{ p.price }}</p>
                {% endif %}

                <a href="{{ url_for('products.product_detail', product_id=p.id) }}"
                   class="btn btn-sm btn-outline-primary">
                    Детальніше
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
